<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindful — AI Support Companion</title>
<link rel="stylesheet" href="/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ==================== AUTH SCREEN ==================== -->
<main id="auth-screen" class="screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Mindful</h1>
      <p class="brand-sub">A quiet space to talk things through</p>
    </div>

    <!-- Google renders its own button inside this div (see app.js
         initGoogleSignIn) — sits outside the login/register tabs below
         since Google's flow doesn't distinguish the two: it signs you in
         if the account exists, creates one if it doesn't, either way. -->
    <div id="google-signin-container" class="google-signin-container" hidden></div>
    <div id="google-signin-divider" class="auth-divider" hidden><span>or</span></div>

    <div class="tabs" role="tablist" aria-label="Authentication mode">
      <button class="tab active" data-mode="login" role="tab" aria-selected="true">Log in</button>
      <button class="tab" data-mode="register" role="tab" aria-selected="false">Register</button>
    </div>

    <form id="auth-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" id="auth-email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="auth-password" autocomplete="current-password" required minlength="8">
      </label>
      <p id="auth-error" class="error-text" role="alert" hidden></p>
      <button type="submit" class="btn-primary" id="auth-submit">Log in</button>
    </form>
  </div>
</main>

<!-- ==================== CHAT SCREEN ==================== -->
<main id="chat-screen" class="screen" hidden>
  <header class="chat-header">
    <div class="header-left">
      <span class="brand-mark small" aria-hidden="true"></span>
      <span class="header-title">Mindful</span>
    </div>
    <div class="header-right">
      <span id="risk-badge" class="risk-badge" data-level="LOW" title="Current session risk level">●&nbsp;steady</span>
      <button id="call-btn" class="icon-btn" title="Start voice call">📞</button>
      <button id="tts-toggle" class="icon-btn" title="Toggle spoken replies" aria-pressed="false">🔈</button>
      <button id="logout-btn" class="icon-btn" title="Log out">⏻</button>
    </div>
  </header>

  <div id="connection-banner" class="connection-banner" hidden></div>

  <section id="message-list" class="message-list" aria-live="polite" aria-atomic="false">
    <div id="empty-state" class="empty-state">
      <p class="empty-state-title">What's on your mind?</p>
      <p class="empty-state-sub">Share what you're feeling — I'm here to listen.</p>
    </div>
  </section>

  <form id="composer" class="composer">
    <div class="composer-row">
      <button type="button" id="mic-btn" class="mic-btn" title="Speak your message">
        <span class="mic-icon" aria-hidden="true">🎙</span>
      </button>
      <textarea id="composer-input" rows="1" placeholder="Type or speak how you're feeling…" maxlength="2000"></textarea>
      <button type="submit" id="send-btn" class="btn-send" title="Send">➤</button>
    </div>
    <p id="listening-hint" class="listening-hint" hidden>Listening… speak now</p>
  </form>
</main>

<!-- ==================== VOICE CALL SCREEN ==================== -->
<main id="voice-screen" class="screen voice-screen" hidden>
  <header class="voice-header">
    <span id="voice-risk-badge" class="risk-badge" data-level="LOW" title="Current session risk level">●&nbsp;steady</span>
    <button id="voice-mute-btn" class="icon-btn" title="Mute microphone" aria-pressed="false">🎙</button>
  </header>

  <div class="voice-stage">
    <div id="voice-orb" class="voice-orb" data-state="idle" aria-hidden="true">
      <div class="voice-orb-core"></div>
    </div>
    <p id="voice-state-label" class="voice-state-label">Connecting…</p>
    <p id="voice-transcript" class="voice-transcript" aria-live="polite"></p>
  </div>

  <div class="voice-controls">
    <button id="voice-end-btn" class="btn-end-call" title="End call">End call</button>
  </div>
</main>

<script src="/app.js"></script>
<script src="/voice-call.js"></script>
</body>
</html>
